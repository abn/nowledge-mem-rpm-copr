name: Automated Update Check & Tito Release

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force version check and release tag creation'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for Upstream Updates
        id: check
        run: |
          python3 update_version.py --check-only

  release-tag:
    needs: check-update
    if: needs.check-update.outputs.is_new == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --user root
    steps:
      - name: Install dependencies & configure Git
        run: |
          dnf install -y git tito
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Upstream & Update Spec
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python3 update_version.py --force
          else
            python3 update_version.py
          fi

      - name: Commit Spec & Tag Release with Tito
        id: tito_release
        run: |
          if [ -n "$(git status --porcelain nowledge-mem.spec)" ]; then
            NEW_VERSION=$(python3 -c "import re; print(re.search(r'^Version:\s*([^\s]+)', open('nowledge-mem.spec').read(), re.MULTILINE).group(1))")
            echo "New version detected: ${NEW_VERSION}"
            
            git add nowledge-mem.spec
            git commit -m "chore: bump version to ${NEW_VERSION}"
            
            tito tag --use-version "${NEW_VERSION}" --accept-auto-changelog
            
            echo "CHANGED=true" >> $GITHUB_OUTPUT
            echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "No version changes detected."
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Push Commits and Tags to GitHub
        if: steps.tito_release.outputs.CHANGED == 'true'
        run: |
          git push origin main --follow-tags
